workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' &&  $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

stages:
  - image_build
  - test

variables:
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_PORT: 5432
  POSTGRES_HOST: db
  DOCKER_POSTGRES_HOST: db
  POSTGRES_DB_AIRFLOW: airflow
  CI: true
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: test
  image: python:3.12-alpine
  rules:
    - changes:
        - datafusion/**/*
        - pyproject.toml
      when: on_success
    - when: never
  before_script:
    - pip install ruff
  script:
    - ruff check --output-format=gitlab --output-file=code-quality-report.json .
    - ruff format --check .
  artifacts:
    reports:
      codequality: code-quality-report.json

run_tests:
  stage: test
  services:
    - name: docker.nexus.services.idea.edu.pl/datafusion/db:latest
      alias: db
  image:
    name: docker.nexus.services.idea.edu.pl/datafusion/airflow:latest
    entrypoint: [""]
  rules:
    - changes:
        - datafusion/**/*
        - tests/**/*
        - pyproject.toml
        - .gitlab-ci.yml
        - tests/conftest.py
        - datafusion/alembic/**/*
      when: on_success
    - when: never
  before_script:
    - pip install --upgrade pip setuptools wheel
    - pip install .[dev]
    - alembic upgrade head
  script:
    - python -m pytest tests/ --junitxml=report.xml
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml

airflow_image_build:
  stage: image_build
  image:
    name: docker.nexus.services.idea.edu.pl/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - >
      /kaniko/executor --context $CI_PROJECT_DIR \
        --dockerfile $CI_PROJECT_DIR/Dockerfile_airflow \
        --destination docker.nexus.services.idea.edu.pl/datafusion/airflow:latest \
        --destination docker.nexus.services.idea.edu.pl/datafusion/airflow:${CI_COMMIT_SHA:0:8} \
      | tee build.log
  artifacts:
    paths:
      - build.log
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

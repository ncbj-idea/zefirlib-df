    - ee_demand_[kwh]
  ee_living:
    ee_total: 635852000 # całkowite zużycie kWh
    multi_area: 5317384 # powierzchnia wielorodzinna [m2]
    single_area: 5499600 # powierzchnia jednorodzinna [m2]

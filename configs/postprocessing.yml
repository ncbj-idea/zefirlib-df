    - co_Kocioł_gazowy_[%]
    - co_Miejska_sieć_ciepłownicza_[%]
    - co_Ogrzewanie_elektryczne_[%]
    - co_Pompa_ciepła_[%]
    - heat_connect
    - heat_disconnect
    - cwu_boiler_new_[%]
    - cwu_boiler_old_[%]
    - cwu_Kocioł_gazowy_[%]
    - cwu_Miejska_sieć_ciepłownicza_[%]
    - cwu_Ogrzewanie_elektryczne_[%]
    - cwu_Pompa_ciepła_[%]

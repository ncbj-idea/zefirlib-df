    "Kocioł olejowy": "oil_boiler"
    "Kocioł na paliwo stałe (węgiel, drewno, pellet lub inny rodzaj biomasy) z automatycznym podawaniem paliwa / z podajnikiem": "solid_fuel_auto"
    "Kocioł na paliwo stałe - pod. automatyczne": "solid_fuel_auto"
    "Kocioł na paliwo stałe (węgiel, drewno, pellet lub inny rodzaj biomasy) z ręcznym podawaniem paliwa / zasypowy": "solid_fuel_manual"
    "Kocioł na paliwo stałe - pod. ręczne": "solid_fuel_manual"
    "Ekoprojekt": "boiler_new"
    "Klasa_5": "boiler_new"
    "Klasa_4": "boiler_old"

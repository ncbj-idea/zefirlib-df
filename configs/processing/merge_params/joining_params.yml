heat_source_analysis_params:
  # 'Średnia powierzchnia mieszkania w m2'
  # 'Average apartment area in m2'
  avg_apartment_area: 68.3
  # 'Mnożnik GUS dla szacowania liczby mieszkań'
  # 'GUS multiplicator for apartment count estimation'
  gus_multiplicator: 1.0
  # 'Nazwa kolumny współczynnika powierzchni użytkowej do powierzchni zabudowy'
  # 'Name of the floor area ratio column'
  floor_area_ratio_column: "wspolczynnik_powierzchni_uzytkowej_do_powierzchni_zabudowy"
  # 'Minimalna proporcja źródła ciepła dla budynków wielorodzinnych'
  # 'Minimum source proportion threshold for multi-family buildings'
  min_source_proportion: 0.10
  # 'Próg dla usuwania par źródeł ciepła o niskiej wadze'
  # 'Threshold for removing low-weight heat source pairs'
  trash_threshold: 0.25
  # 'Mapowanie nazw źródeł ciepła na wewnętrzne nazwy'
  # 'Mapping of heat source names to internal names'
  source_translation:
    "Miejska sieć ciepłownicza / ciepło systemowe / lokalna sieć ciepłownicza": "district_heating"
    "Miejska sieć ciepłownicza": "district_heating"
    "Kocioł gazowy / bojler gazowy / podgrzewacz gazowy przepływowy / kominek gazowy": "gas_boiler"

---
# DataFusion Docker Compose Configuration
# Core services run by default, Airflow services are optional via profile

x-database-common:
  &database-env
  POSTGRES_HOST: ${DOCKER_POSTGRES_HOST}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB_AIRFLOW: ${POSTGRES_DB_AIRFLOW}
  DB_IMAGE: ${DB_IMAGE:-postgis/postgis:12-3.5}

x-core-common:
  &core-common
  build: &core-build
    context: .
    dockerfile: Dockerfile
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  environment:
    <<: *database-env
    DISPLAY: ${DISPLAY}
    LOG_CFG: ${LOG_CFG:-logging.yml}
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:ro
    - ./input:/app/input:rw,cached
    - ./output:/app/output:rw

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile_airflow
  environment:
    &airflow-common-env
    <<: *database-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB_AIRFLOW}
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-""}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__SHOW_TRIGGER_FORM_IF_NO_PARAMS: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${SECRET_KEY}
  volumes:
    - ./input:/app/input:rw,cached
    - ./output:/app/output:rw

  depends_on:
    &airflow-common-depends-on
    db:
      condition: service_healthy

services:
  # ===========================================
  # Database Service (Always Available)
  # ===========================================
  db:
    container_name: datafusion-db
    environment:
      POSTGRES_DB_AIRFLOW: ${POSTGRES_DB_AIRFLOW}
      <<: *database-env
    image: ${DB_IMAGE:-postgis/postgis:12-3.5}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: "pg_isready -U $POSTGRES_USER -p $POSTGRES_PORT && psql -U $POSTGRES_USER -d $POSTGRES_DB -c 'SELECT 1;'"
      interval: 15s
      retries: 5
      start_period: 120s
    volumes:
      - db-volume:/var/lib/postgresql/data
      - ./configs:/etc/datafusion:ro

  # ===========================================
  # Core Application Services (Default)
  # ===========================================
  core:
    <<: *core-common
    build:
      <<: *core-build
      target: core
    container_name: datafusion-core
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - core
    entrypoint: ["/app/scripts/db-migrate.sh"]
    command: ["run"]

  gui:
    <<: *core-common
    build:
      <<: *core-build
      target: gui
    container_name: datafusion-gui
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-env
      DISPLAY: ${DISPLAY}
      DATAFUSION_CONFIG_DIR: /datafusion/configs
      QT_QPA_PLATFORM: xcb
      # Disable shared memory (not available over network X11)
      QT_X11_NO_MITSHM: 1
    profiles:
      - gui
    entrypoint: ["/app/scripts/db-migrate.sh"]
    command: ["gui"]

  # ===========================================
  # Airflow Services (Optional - use --profile airflow)
  # ===========================================
  airflow-init:
    <<: *airflow-common
    container_name: datafusion-airflow-init
    profiles:
      - airflow
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        # Create Airflow database if it doesn't exist
        echo "Creating database $POSTGRES_DB_AIRFLOW with owner $POSTGRES_USER..."
        if ! psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -lqt | cut -d \| -f 1 | grep -qw "$POSTGRES_DB_AIRFLOW"; then
          psql -v ON_ERROR_STOP=1 -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<-EOF
            CREATE DATABASE $POSTGRES_DB_AIRFLOW OWNER $POSTGRES_USER;
          EOF
        else
          echo "Database $POSTGRES_DB_AIRFLOW already exists."
        fi
        echo "Database $POSTGRES_DB_AIRFLOW ready."

        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  airflow-scheduler:
    <<: *airflow-common
    container_name: datafusion-airflow-scheduler
    profiles:
      - airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: datafusion-airflow-triggerer
    profiles:
      - airflow
    command: triggerer
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: datafusion-airflow-webserver
    profiles:
      - airflow
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    container_name: datafusion-airflow-cli
    profiles:
      - airflow
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

volumes:
  db-volume:
